# =============================================================================
# Avalanche eDNA - GitHub Actions Local CI Pipeline
# =============================================================================
# Triggers: push/PR to main & develop, plus manual dispatch
# Stages:
#   1. lint       → flake8, mypy, black, isort
#   2. test       → pytest with coverage (Python 3.10 & 3.11)
#   3. build      → Docker multi-stage CPU image build verification
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================================
  # Job 1: Code Quality (Lint + Type Checks)
  # ===========================================================================
  lint:
    name: "🔍 Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: |
          pip install --upgrade pip
          pip install \
            black>=24.0.0 \
            flake8>=7.0.0 \
            flake8-bugbear \
            flake8-docstrings \
            mypy>=1.8.0 \
            isort>=5.13.0 \
            pyyaml \
            types-PyYAML \
            types-requests

      - name: Run black (formatting check)
        run: black --check --diff src/ scripts/ tests/

      - name: Run isort (import ordering)
        run: isort --profile black --check-only --diff src/ scripts/ tests/

      - name: Run flake8 (PEP8 + bugbear)
        run: |
          flake8 src/ scripts/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E501,W291,W293,E402,F401,F841,F541,E722,F821,E741,F402,E712,E721,E231,F811,D,B \
            --exclude=__pycache__,.git,*.egg-info

      - name: Run mypy (type checking)
        run: |
          mypy src/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --python-version=3.11
        continue-on-error: true

  # ===========================================================================
  # Job 2: Unit & Integration Tests
  # ===========================================================================
  test:
    name: "🧪 Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (bioinformatics tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ncbi-blast+ \
            libhdf5-dev \
            libssl-dev

      - name: Install Python dependencies (CPU-only for CI)
        run: |
          pip install --upgrade pip
          pip install torch==2.4.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install \
            transformers>=4.38.0 \
            biopython>=1.83 \
            numpy>=1.24.0 \
            pandas>=2.0.0 \
            scipy>=1.11.0 \
            scikit-learn>=1.3.0 \
            umap-learn>=0.5.6 \
            hdbscan>=0.8.33 \
            faiss-cpu>=1.7.4 \
            lancedb>=0.6.0 \
            pyarrow>=14.0.0 \
            matplotlib>=3.7.0 \
            seaborn>=0.12.0 \
            plotly>=5.18.0 \
            pyyaml>=6.0.1 \
            click>=8.1.7 \
            requests>=2.31.0 \
            tqdm>=4.66.0 \
            joblib>=1.3.0 \
            python-dotenv>=1.0.0 \
            sqlalchemy>=2.0.0 \
            psycopg2-binary>=2.9.9 \
            cutadapt>=4.6 \
            pytest>=7.4.0 \
            pytest-cov>=4.1.0 \
            pytest-xdist>=3.5.0 \
            pytest-mock>=3.12.0
          pip install -e . --no-deps

      - name: Create required directories
        run: |
          mkdir -p logs data/raw data/processed data/reference data/output models/trained

      - name: Run unit tests with coverage
        env:
          EDNA_ENV: testing
          DB_TYPE: sqlite
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=15 \
            -n auto \
            -v \
            --tb=short \
            --ignore=tests/test_sra_download.py \
            --ignore=tests/test_model_memory.py \
            --ignore=tests/test_dynamic_pipeline_integration.py

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: avalanche-edna-coverage
        continue-on-error: true

  # ===========================================================================
  # Job 3: Build Docker Image Verification
  # ===========================================================================
  build:
    name: "🐳 Build Docker Image Verification"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Build Docker image (verification only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          target: runtime
          push: false
          tags: avalanche-edna:local
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          platforms: linux/amd64
